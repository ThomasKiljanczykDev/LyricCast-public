name: Android build setup
description: >
  Sets up Temurin JDK 17 and Gradle (with caching + wrapper validation) and writes a CI stub
  google-services.json so the app module's Google Services / Crashlytics plugins can build. The
  real google-services.json is gitignored and never present in CI; the stub carries the correct
  package name with inert placeholder values (Firebase/Crashlytics calls are no-ops under test).

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        validate-wrappers: true

    - name: Write google-services.json stub
      shell: bash
      working-directory: android/app
      run: |
        cat > google-services.json <<'JSON'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "lyriccast-ci",
            "storage_bucket": "lyriccast-ci.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": {
                  "package_name": "dev.thomas_kiljanczyk.lyriccast"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyA0000000000000000000000000000000000"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        JSON
